<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8EBCF" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sc-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          document.documentElement.classList.toggle('light', theme === 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'light' ? '#F8EBCF' : '#050508');
        } catch (e) {}
        /* Early perf flag — CSS can disable blur before React hydrates */
        try {
          var coarse = window.matchMedia('(pointer: coarse)').matches;
          var narrow = window.matchMedia('(max-width: 768px)').matches;
          var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
          var android = /Android/i.test(navigator.userAgent);
          var cores = navigator.hardwareConcurrency || 4;
          var mem = navigator.deviceMemory || 8;
          var saveData = !!(navigator.connection && navigator.connection.saveData);
          var mobile = coarse || narrow;
          var low =
            reduce ||
            saveData ||
            mem <= 2 ||
            cores <= 2 ||
            (android && mobile) ||
            (mobile && (mem <= 4 || cores <= 4));
          document.documentElement.setAttribute('data-perf', low || mobile ? 'low' : 'high');
          document.documentElement.setAttribute('data-mobile', mobile ? 'true' : 'false');
          if (android) document.documentElement.setAttribute('data-android', 'true');
        } catch (e2) {
          document.documentElement.setAttribute('data-perf', 'low');
        }
      })();
    </script>
    
    <title>Startup Confluence 2.0 | India's Premier Startup Summit</title>
    <meta name="description" content="Join India's premier startup summit. Connect with founders, investors, and innovators at Startup Confluence 2.0." />
    
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body class="antialiased" style="background-color: var(--bg); color: var(--text-primary);">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
